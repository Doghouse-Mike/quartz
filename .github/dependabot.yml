version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Pinned: Preact 11.1+ renders vnodes from another Preact copy as empty, and
    # the lock-pinned plugins bundle their own. Remove after upgrading to
    # Quartz 5.1 plugins, which share the host's Preact (jackyzha0/quartz#2613).
    ignore:
      - dependency-name: "preact"
      - dependency-name: "preact-render-to-string"
    groups:
      # Separated so a risky third-party major cannot block ecosystem updates.
      quartz-ecosystem:
        applies-to: "version-updates"
        patterns:
          - "@quartz-community/*"
          - "@quartz-themes/*"
      # Isolated because a compiler major needs a tsconfig migration of its own.
      typescript:
        applies-to: "version-updates"
        patterns:
          - "typescript"
      production-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "@quartz-community/*"
          - "@quartz-themes/*"
          - "typescript"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
